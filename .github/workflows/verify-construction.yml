name: Verify PlayerEngine
on:
  push:
    branches: [feature/autonomous-goals]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run standalone construction planner regression tests
        run: |
          mkdir -p build/isolated-tests
          javac -d build/isolated-tests src/autoclef/java/adris/altoclef/tasks/construction/build_structure/ConstructionMaterialPlanner.java src/test/java/adris/altoclef/tasks/construction/build_structure/ConstructionMaterialPlannerTest.java
          java -cp build/isolated-tests adris.altoclef.tasks.construction.build_structure.ConstructionMaterialPlannerTest
      - name: Compile mod and run tests
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: playerengine-development-build
          path: build/libs/*.jar
          if-no-files-found: warn
