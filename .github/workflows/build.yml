name: Build

on:
  push:
    branches: [main, codex/ellie-setup11-reliability, codex/ellie-survival-setup]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ellie:
    name: Ellie 1.21.1 preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELLIE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: ellie
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test Ellie
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/reports
          bash build.sh 2>&1 | tee build/reports/regression.log
      - name: Historical sidecar regression checks (not shipped in the native Player2 JAR)
        run: node --test tests/*.test.mjs
      - name: Package portable preview
        run: python3 make_release.py
      - name: Upload task routing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ellie-task-routing
          path: ellie/build/reports/
          if-no-files-found: ignore
      - name: Verify exact packaged revision
        run: python3 tests/verify_build_revision.py
      - name: Prepare installable JAR
        env:
          ELLIE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p build/install
          cp dist/PlayerEngine-Fabric-1.21.1-1.4.0-ELLIE-PLAYER2-SHARED-RECOVERY.jar "build/install/PlayerEngine-Fabric-1.21.1-1.4.0-ELLIE-PartialBlockNavigation-${ELLIE_REVISION:0:7}-UNVERIFIED.jar"
          (cd build/install && sha256sum *.jar > SHA256SUMS.txt)
      - name: Upload installable Ellie JAR
        uses: actions/upload-artifact@v4
        with:
          name: Ellie-1.21.1-JAR-only
          path: ellie/build/install/
          if-no-files-found: error
      - name: Upload portable source bundle
        uses: actions/upload-artifact@v4
        with:
          name: Ellie-1.21.1-source-bundle
          path: ellie/dist/PlayerEngine-Ellie-Player2-Shared-Recovery.zip
          if-no-files-found: error

  legacy:
    if: github.ref == 'refs/heads/main' || github.event.pull_request.base.ref == 'main'
    name: Legacy 1.20.1 source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and check
        run: bash gradlew --no-daemon --max-workers=2 build
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: build/reports/
          if-no-files-found: ignore
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: Legacy-1.20.1-jars
          path: build/libs/*.jar
          if-no-files-found: error
