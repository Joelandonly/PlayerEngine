name: Inspect matching Fabric release
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/inspect-1211-release.yml']
    branches: ['feature/autonomous-goals']
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Retrieve actual 1.21.1 Fabric 1.4.0 binaries and inspect public API
        run: |
          mkdir -p release-inspection
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, os, zipfile
          for slug in ('playerengine','player2npc'):
            url='https://api.modrinth.com/v2/project/'+slug+'/version'
            req=urllib.request.Request(url,headers={'User-Agent':'PlayerEngine-compatible-branch-inspection/0.1'})
            versions=json.load(urllib.request.urlopen(req,timeout=35))
            matches=[v for v in versions if '1.21.1' in v['game_versions'] and 'fabric' in v['loaders'] and '1.4.0' in v['version_number']]
            if not matches:
                raise Exception('Missing 1.21.1 1.4.0 Fabric release for '+slug)
            v=matches[0]
            f=next((f for f in v['files'] if f['primary']),v['files'][0])
            data=urllib.request.urlopen(f['url'],timeout=55).read()
            dest='release-inspection/'+slug+'-1.21.1-1.4.0.jar'
            open(dest,'wb').write(data)
            print(slug,'downloaded',len(data),'bytes',v['version_number'],f['filename'])
            with zipfile.ZipFile(dest) as z:
                names=z.namelist()
                for fname in ['fabric.mod.json','META-INF/MANIFEST.MF']:
                    if fname in names:
                        open('release-inspection/'+slug+'-'+fname.split('/')[-1]+'.txt','w').write(z.read(fname).decode(errors='replace'))
                with open('release-inspection/'+slug+'-classes.txt','w') as out:
                    out.write('\n'.join(n for n in names if n.endswith('.class')))
          PY
          for jar in release-inspection/*.jar; do
            target=${jar%.jar}
            grep -E -i '(agentic|planner|build|schemat|blueprint|taskcatalog|command|player2|material|craft)' "${target%-1.21.1-1.4.0}-classes.txt" | head -n 100 > "$target-relevant-classes.txt" || true
          done
          du -h release-inspection/*
      - uses: actions/upload-artifact@v4
        with:
          name: matching-playerengine-release-inspection
          path: release-inspection/
          retention-days: 1
